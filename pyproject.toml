[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The PyPI name carries the namespace, as szsdlc's does; the import package and
# the command are `szsdlc_ui_win95` and `szsdlc-ui-win95`.
name = "zhaostephen-szsdlc-ui-win95"
description = "A Windows 95-styled, trait-driven browser viewer for szsdlc projects, served by a small local backend."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Stephen Zhao" }]
keywords = ["sdlc", "szsdlc", "viewer", "windows-95"]
dynamic = ["version"]

# The viewer reads every project through szsdlc itself, never a second loader.
dependencies = [
    "zhaostephen-szsdlc>=0.2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

# Kept in step with the other stephen-zhao Python repos: bump-my-version does
# the bumping, uv does the building, pytest does the rest.
[dependency-groups]
dev = [
    "bump-my-version>=1.2.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "uv>=0.8.11",
]

[project.scripts]
szsdlc-ui-win95 = "szsdlc_ui_win95.cli:main"

[project.urls]
Homepage = "https://github.com/stephen-zhao/szsdlc-ui-win95"
Tracker = "https://github.com/stephen-zhao/szsdlc-szsdlc"

# Single source of truth for the version: src/szsdlc_ui_win95/__init__.py
[tool.hatch.version]
path = "src/szsdlc_ui_win95/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/szsdlc_ui_win95"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["szsdlc_ui_win95"]
omit = ["*/szsdlc_ui_win95/__main__.py"]  # a two-line shim onto cli.main
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# Same release scheme as the other stephen-zhao Python repos: the Bump Version
# workflow runs `make bump-version PART=…`, which commits and tags vX.Y.Z; the
# Publish workflow reads current_version below to check a tag against its tree.
[tool.bumpversion]
current_version = "0.1.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "src/szsdlc_ui_win95/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
